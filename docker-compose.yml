# Interactive BiochemicalVisualization viewer over JupyterLab.
#
#   docker compose up --build        # first run builds the image (slow: Julia precompile)
#   open http://<this-host>:8888/lab?token=<JUPYTER_TOKEN>
#
# From an iPhone/other device: use the host's LAN IP instead of localhost,
# e.g. http://192.168.1.42:8888/lab?token=change-me   (see deploy/README.md).
services:
  viewer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "28888:8888"
    environment:
      # Emit proxy-relative Bonito URLs so the viewer works from a remote
      # browser (not just localhost). Required for phone access.
      BCV_JUPYTER_PROXY: "1"
      # Fixed access token so the URL is stable. CHANGE THIS.
      JUPYTER_TOKEN: "change-me"
    volumes:
      # Persist / edit notebooks on the host. Comment out to keep them
      # inside the container only.
      - ./deploy/notebooks:/work
    restart: unless-stopped
